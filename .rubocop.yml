AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Style/StringLiterals:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/TopLevelMethodDefinition:
  Enabled: false

Style/CombinableLoops:
  Enabled: false

Style/SafeNavigation:
  Enabled: false

Naming/FileName:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false
